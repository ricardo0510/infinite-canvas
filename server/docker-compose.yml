services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinite-canvas-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8790"
      DATABASE_URL: postgresql://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      WORKER_DISABLED: "true"
    ports:
      - "8790:8790"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinite-canvas-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      WORKER_DISABLED: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node dist/worker.js

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinite-canvas-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ADMIN_PORT: "8791"
      DATABASE_URL: postgresql://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379
    ports:
      - "8791:8791"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node dist/admin-server.js

  # 一次性初始化：docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinite-canvas-api:local
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma db seed

volumes:
  postgres-data:
  redis-data:
  uploads:
